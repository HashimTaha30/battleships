<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, 40px);
            grid-template-rows: repeat(10, 40px);
            gap: 2px;
            margin: 20px auto;
            width: fit-content;
        }

        .cell {
            width: 40px;
            height: 40px;
            background-color: lightblue;
            border: 1px solid white;
            text-align: center;
            line-height: 40px;
            cursor: pointer;
        }

        .cell.placed {
            background-color: red;
        }

        .cell.hit {
            background-color: green;
        }

        .cell.miss {
            background-color: gray;
        }

        input, button, select {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: none;
        }

        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        #gameSection {
            display: none;
        }

        #attackSection, #adminSection {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container" id="loginSection">
        <h1>Welcome to the Battleship Game</h1>
        <p>Select your name to start:</p>
        <button onclick="selectPlayer('Hamza Noor')">Hamza Noor</button>
        <button onclick="selectPlayer('Samer Smahan')">Samer Smahan</button>
        <button onclick="selectPlayer('Moatz Abo Alkhair')">Moatz Abo Alkhair</button>
        <button onclick="selectPlayer('Braa Abo Klisha')">Braa Abo Klisha</button>
        <button onclick="selectPlayer('Yousef Mohaned')">Yousef Mohaned</button>
    </div>

    <div class="container" id="gameSection">
        <h2>Place Your Troops</h2>
        <div class="board" id="gameBoard"></div>
        <button onclick="startGame()">Start Game</button>
    </div>

    <div class="container" id="attackSection">
        <h2>Attack Phase</h2>
        <div class="board" id="attackBoard"></div>
        <h3>Enter Attack Code</h3>
        <input type="text" id="attackCode" placeholder="Enter Attack Code">
        <h3>Select a Player to Attack</h3>
        <select id="targetPlayer">
            <option value="Hamza Noor">Hamza Noor</option>
            <option value="Samer Smahan">Samer Smahan</option>
            <option value="Moatz Abo Alkhair">Moatz Abo Alkhair</option>
            <option value="Braa Abo Klisha">Braa Abo Klisha</option>
            <option value="Yousef Mohaned">Yousef Mohaned</option>
        </select>
        <h3>Enter Grid Coordinates to Attack (e.g., A1, B5)</h3>
        <input type="text" id="attackCoordinate" placeholder="Enter Coordinate">
        <button onclick="useAttackCode()">Attack</button>
        <p id="attackResult"></p>
    </div>

    <div class="container" id="adminSection">
        <h2>Admin Panel</h2>
        <h3>Player Scores</h3>
        <ul id="scoreList"></ul>
    </div>

    <script>
        let selectedPlayer = null;
        let placedTroops = new Set();
        let playerScores = {
            "Hamza Noor": 0,
            "Samer Smahan": 0,
            "Moatz Abo Alkhair": 0,
            "Braa Abo Klisha": 0,
            "Yousef Mohaned": 0
        };

        function selectPlayer(playerName) {
            selectedPlayer = playerName;
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("gameSection").style.display = "block";
            createBoard("gameBoard", placeTroop);
        }

        function createBoard(boardId, clickHandler) {
            const board = document.getElementById(boardId);
            board.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 10; j++) {
                    let cell = document.createElement("div");
                    cell.classList.add("cell");
                    cell.dataset.coord = `${i},${j}`;
                    cell.textContent = `${i},${j}`;
                    if (clickHandler) cell.addEventListener("click", clickHandler);
                    board.appendChild(cell);
                }
            }
        }

        function placeTroop(event) {
            if (placedTroops.size < 12) {
                event.target.classList.add("placed");
                placedTroops.add(event.target.dataset.coord);
            } else {
                alert("You can only place 12 troops.");
            }
        }

        function startGame() {
            console.log(`${selectedPlayer} has started the game!`);
            document.getElementById("gameSection").style.display = "none";
            document.getElementById("attackSection").style.display = "block";
            createBoard("attackBoard", attackCell);
        }

        function attackCell(event) {
            const coordinate = event.target.dataset.coord;
            if (placedTroops.has(coordinate)) {
                event.target.classList.add("hit");
                playerScores[selectedPlayer] += 5;
            } else {
                event.target.classList.add("miss");
            }
            updateScore();
        }

        function useAttackCode() {
            let result = document.getElementById("attackResult");
            let coordinate = document.getElementById("attackCoordinate").value;
            let targetPlayer = document.getElementById("targetPlayer").value;
            
            // Check if attack coordinate exists in placedTroops for target player
            let hit = placedTroops.has(coordinate);
            result.textContent = hit ? `${targetPlayer}: Hit! +5 Points` : `${targetPlayer}: Missed!`;

            if (hit) {
                playerScores[selectedPlayer] += 5;
            }

            updateScore();
        }

        function updateScore() {
            let scoreList = document.getElementById("scoreList");
            scoreList.innerHTML = "";
            for (let player in playerScores) {
                let li = document.createElement("li");
                li.textContent = `${player}: ${playerScores[player]} points`;
                scoreList.appendChild(li);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship Game</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .scoreboard {
            margin-bottom: 20px;
            font-size: 18px;
        }
        .scoreboard span {
            margin: 0 10px;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(10, 40px);
            grid-template-rows: repeat(10, 40px);
            gap: 2px;
            margin: 20px auto;
            width: fit-content;
        }
        .cell {
            width: 40px;
            height: 40px;
            background-color: lightblue;
            border: 1px solid white;
            text-align: center;
            line-height: 40px;
            cursor: pointer;
        }
        .cell.placed {
            background-color: red;
        }
        .cell.hit {
            background-color: green;
        }
        .cell.miss {
            background-color: gray;
        }
        input, button, select {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        #attackSection, #adminSection {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="scoreboard">
        <span>Hamza Noor: <span id="scoreHamzaNoor">0</span> points</span>
        <span>Samer Smahan: <span id="scoreSamerSmahan">0</span> points</span>
        <span>Moatz Abo Alkhair: <span id="scoreMoatzAboAlkhair">0</span> points</span>
        <span>Braa Abo Klisha: <span id="scoreBraaAboKlisha">0</span> points</span>
        <span>Yousef Mohaned: <span id="scoreYousefMohaned">0</span> points</span>
    </div>

    <div class="container" id="playerListSection">
        <h1>Select a Player</h1>
        <ul>
            <li><button onclick="login('Hamza Noor')">Hamza Noor</button></li>
            <li><button onclick="login('Samer Smahan')">Samer Smahan</button></li>
            <li><button onclick="login('Moatz Abo Alkhair')">Moatz Abo Alkhair</button></li>
            <li><button onclick="login('Braa Abo Klisha')">Braa Abo Klisha</button></li>
            <li><button onclick="login('Yousef Mohaned')">Yousef Mohaned</button></li>
        </ul>
    </div>

    <div class="container" id="gameSection" style="display:none;">
        <h2>Place Your Troops</h2>
        <div class="board" id="gameBoard"></div>
        <button id="readyButton" onclick="readyUp()">Ready</button>
    </div>

    <div class="container" id="attackSection">
        <h2>Attack Phase</h2>
        <div class="board" id="attackBoard"></div>
        <h3>Enter Attack Code</h3>
        <input type="text" id="attackCode" placeholder="Enter Attack Code">
        <h3>Select a Player to Attack</h3>
        <select id="targetPlayer">
            <option value="Hamza Noor">Hamza Noor</option>
            <option value="Samer Smahan">Samer Smahan</option>
            <option value="Moatz Abo Alkhair">Moatz Abo Alkhair</option>
            <option value="Braa Abo Klisha">Braa Abo Klisha</option>
            <option value="Yousef Mohaned">Yousef Mohaned</option>
        </select>
        <h3>Enter Grid Coordinates to Attack (e.g., A1, B5)</h3>
        <input type="text" id="attackCoordinate" placeholder="Enter Coordinate">
        <button onclick="useAttackCode()">Attack</button>
        <p id="attackResult"></p>
    </div>

    <div class="container" id="adminSection">
        <h2>Admin Panel</h2>
        <h3>Player Scores</h3>
        <ul id="scoreList"></ul>
    </div>

    <script>
        const playerCodes = {
            "Hamza Noor": "HN123",
            "Samer Smahan": "SS456",
            "Moatz Abo Alkhair": "MA789",
            "Braa Abo Klisha": "BK101",
            "Yousef Mohaned": "YM112",
            "Admin": "ADMIN4444"
        };

        let playerScores = {
            "Hamza Noor": 0,
            "Samer Smahan": 0,
            "Moatz Abo Alkhair": 0,
            "Braa Abo Klisha": 0,
            "Yousef Mohaned": 0
        };

        let placedTroops = new Set();
        const attackCodes = new Set([
            "ATK04", "ATK023 "ATK003", "ATK004", "ATK005",
            "ATK54", "ATK0345"ATK008", "ATK009", "ATK010",
            "ATK031", "ATK012", "ATK013", "ATK014", "ATK015",
            "ATK56", "ATK017", "ATK018", "ATK019", "ATK020",
            "ATK21", "ATK022", "ATK023", "ATK024", "ATK025"
        ]);

        function login(playerName) {
            document.getElementById("playerListSection").style.display = "none";
            if (playerName === "Admin") {
                document.getElementById("adminSection").style.display = "block";
                updateAdminPanel();
            } else {
                document.getElementById("gameSection").style.display = "block";
                createBoard("gameBoard", placeTroop);
            }
        }

        function createBoard(boardId, clickHandler) {
            const board = document.getElementById(boardId);
            board.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 10; j++) {
                    let cell = document.createElement("div");
                    cell.classList.add("cell");
                    cell.dataset.coord = `${i},${j}`;
                    cell.textContent = `${i},${j}`;
                    if (clickHandler) cell.addEventListener("click", clickHandler);
                    board.appendChild(cell);
                }
            }
        }

        function placeTroop(event) {
            if (placedTroops.size < 12) {
                event.target.classList.add("placed");
                placedTroops.add(event.target.dataset.coord);
            } else {
                alert("You can only place 12 troops.");
            }
        }

        function readyUp() {
            if (placedTroops.size === 12) {
                alert("You are ready to start the attack phase!");
                document.getElementById("attackSection").style.display = "block";
                document.getElementById("gameSection").style.display = "none";
                createBoard("attackBoard", null);  // No troop placement allowed here
            } else {
                alert("Please place all 12 troops before proceeding.");
            }
        }

        function useAttackCode() {
            let code = document.getElementById("attackCode").value;
            let coordinate = document.getElementById("attackCoordinate").value;
            let result = document.getElementById("attackResult");

            if (!attackCodes.has(code)) {
                result.textContent = "Invalid or already used attack code!";
                return;
            }

            attackCodes.delete(code);  // Remove the used code

            let hit = placedTroops.has(coordinate);
            result.textContent = hit ? "Hit! +5 Points" : "You have hit nothing.";
            if (hit) playerScores["Hamza Noor"] += 5;
            updateAdminPanel();
            updateScoresDisplay();
        }

        function updateAdminPanel() {
            let scoreList = document.getElementById("scoreList");
            scoreList.innerHTML = "";
            for (let player in playerScores) {
                let li = document.createElement("li");
                li.textContent = `${player}: ${playerScores[player]} points`;
                scoreList.appendChild(li);
            }
        }

        function updateScoresDisplay() {
            document.getElementById("scoreHamzaNoor").textContent = playerScores["Hamza Noor"];
            document.getElementById("scoreSamerSmahan").textContent = playerScores["Samer Smahan"];
            document.getElementById("scoreMoatzAboAlkhair").textContent = playerScores["Moatz Abo Alkhair"];
            document.getElementById("scoreBraaAboKlisha").textContent = playerScores["Braa Abo Klisha"];
            document.getElementById("scoreYousefMohaned").textContent = playerScores["Yousef Mohaned"];
        }
    </script>
</body>
</html>

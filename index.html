<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(10, 40px);
            grid-template-rows: repeat(10, 40px);
            gap: 2px;
            margin: 20px auto;
            width: fit-content;
        }
        .cell {
            width: 40px;
            height: 40px;
            background-color: lightblue;
            border: 1px solid white;
            text-align: center;
            line-height: 40px;
            cursor: pointer;
        }
        .cell.placed {
            background-color: red;
        }
        .cell.hit {
            background-color: green;
        }
        .cell.miss {
            background-color: gray;
        }
        input, button, select {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        #attackSection, #adminSection {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container" id="loginSection">
        <h1>Welcome to the Battleship Game</h1>
        <p>Enter your login code to continue:</p>
        <input type="text" id="loginCode" placeholder="Enter Code">
        <button onclick="login()">Login</button>
    </div>

    <div class="container" id="gameSection" style="display:none;">
        <h2>Place Your Troops</h2>
        <div class="board" id="gameBoard"></div>
        <button onclick="readyUp()">Ready</button>
    </div>

    <div class="container" id="attackSection">
        <h2>Attack Phase</h2>
        <div class="board" id="attackBoard"></div>
        <h3>Enter Attack Code</h3>
        <input type="text" id="attackCode" placeholder="Enter Attack Code">
        <h3>Select a Player to Attack</h3>
        <select id="targetPlayer">
            <option value="Hamza Noor">Hamza Noor</option>
            <option value="Samer Smahan">Samer Smahan</option>
            <option value="Moatz Abo Alkhair">Moatz Abo Alkhair</option>
            <option value="Braa Abo Klisha">Braa Abo Klisha</option>
            <option value="Yousef Mohaned">Yousef Mohaned</option>
        </select>
        <h3>Enter Grid Coordinates to Attack (e.g., A1, B5)</h3>
        <input type="text" id="attackCoordinate" placeholder="Enter Coordinate">
        <button onclick="useAttackCode()">Attack</button>
        <p id="attackResult"></p>
    </div>

    <div class="container" id="adminSection">
        <h2>Admin Panel</h2>
        <h3>Player Scores</h3>
        <ul id="scoreList"></ul>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA2l_bt2MxCPMJGl9ImOjp2FBU-skkkSNw",
            authDomain: "battleship-10733.firebaseapp.com",
            databaseURL: "https://battleship-10733-default-rtdb.firebaseio.com",
            projectId: "battleship-10733",
            storageBucket: "battleship-10733.firebasestorage.app",
            messagingSenderId: "137222756550",
            appId: "1:137222756550:web:c62b2691c35d4ea6061fc7",
            measurementId: "G-0S248X0JM1"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Player codes
        const playerCodes = {
            "Hamza Noor": "HN123",
            "Samer Smahan": "SS456",
            "Moatz Abo Alkhair": "MA789",
            "Braa Abo Klisha": "BK101",
            "Yousef Mohaned": "YM112",
            "Admin": "ADMIN4444"
        };

        let playerScores = {
            "Hamza Noor": 0,
            "Samer Smahan": 0,
            "Moatz Abo Alkhair": 0,
            "Braa Abo Klisha": 0,
            "Yousef Mohaned": 0
        };

        let placedTroops = new Set();
        
        function login() {
            let code = document.getElementById("loginCode").value;
            let playerName = Object.keys(playerCodes).find(name => playerCodes[name] === code);
            
            if (playerName) {
                document.getElementById("loginSection").style.display = "none";
                if (playerName === "Admin") {
                    document.getElementById("adminSection").style.display = "block";
                    updateAdminPanel();
                } else {
                    document.getElementById("gameSection").style.display = "block";
                    createBoard("gameBoard", placeTroop);
                }
            } else {
                alert("Invalid login code");
            }
        }

        function createBoard(boardId, clickHandler) {
            const board = document.getElementById(boardId);
            board.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 10; j++) {
                    let cell = document.createElement("div");
                    cell.classList.add("cell");
                    cell.dataset.coord = `${i},${j}`;
                    cell.textContent = `${i},${j}`;
                    if (clickHandler) cell.addEventListener("click", clickHandler);
                    board.appendChild(cell);
                }
            }
        }

        function placeTroop(event) {
            if (placedTroops.size < 12) {
                event.target.classList.add("placed");
                placedTroops.add(event.target.dataset.coord);
            } else {
                alert("You can only place 12 troops.");
            }
        }

        function readyUp() {
            document.getElementById("gameSection").style.display = "none";
            document.getElementById("attackSection").style.display = "block";
            createBoard("attackBoard");
        }

        function useAttackCode() {
            let coordinate = document.getElementById("attackCoordinate").value;
            let result = document.getElementById("attackResult");
            let hit = placedTroops.has(coordinate);
            result.textContent = hit ? "Hit! +5 Points" : "You have hit nothing.";
            if (hit) playerScores["Hamza Noor"] += 5;
            updateAdminPanel();
            saveScoreToFirebase();
        }

        function updateAdminPanel() {
            let scoreList = document.getElementById("scoreList");
            scoreList.innerHTML = "";
            for (let player in playerScores) {
                let li = document.createElement("li");
                li.textContent = `${player}: ${playerScores[player]} points`;
                scoreList.appendChild(li);
            }
        }

        function saveScoreToFirebase() {
            const playerRef = db.ref("players");
            playerRef.set(playerScores);
        }

    </script>
</body>
</html>
